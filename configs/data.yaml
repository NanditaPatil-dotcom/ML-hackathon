# Mock data generation settings, and the feature schema the modeling code
# expects. This now matches pathsnap.data.preprocessing.pipeline's candidates
# parquet column-for-column, so no renaming is needed between preprocessing
# and modeling.
mock:
  n_points: 2000
  n_roads: 300
  seed: 42

# Columns every dataset fed into src/pathsnap must have (candidate_rank is
# added automatically by load_dataset if missing — see
# pathsnap.data.build_features.add_candidate_rank).
required_columns:
  - dist_to_segment_m        # float, meters: perpendicular GPS point -> candidate segment
  - bearing_alignment_deg    # float, degrees: GPS heading vs. segment bearing alignment
  - speed_limit_proxy_mps    # float, m/s: proxy for the candidate road's speed limit
  - point_speed_mps          # float, m/s: the GPS point's own instantaneous speed
  - arc_length_m             # float, meters: length of the candidate road segment
  - candidate_rank           # int: rank by dist_to_segment_m within (trip_id, point_idx), 0 = nearest
  - is_ground_truth_arc      # int 0/1: is this candidate the true road (the label)

# NOT used as a model feature: a per-trip row index into that trip's own
# .arcs file, so the same id means a different road in a different trip.
# candidate_rank is the trip-independent substitute.
excluded_columns:
  - candidate_arc_id

optional_columns:
  - trip_id     # groups candidates for leak-free CV splits
  - point_idx   # groups candidates of one GPS point (top-1 accuracy, HMM emission norm)

# Hyperparameters for each model family, loaded by src/pathsnap/models/*.py.
# Edit here instead of in code so a teammate can retune without touching Python.
catboost:
  iterations: 500
  depth: 6
  learning_rate: 0.05
  loss_function: Logloss
  random_seed: 42
  verbose: 0

rbf_svm:
  kernel: rbf
  C: 3.0
  gamma: scale
  probability: true
  random_state: 42

lightgbm:
  n_estimators: 150
  learning_rate: 0.08
  num_leaves: 31
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  verbose: -1
  n_jobs: -1

extra_trees:
  n_estimators: 300
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: sqrt
  class_weight: balanced
  random_state: 42
  n_jobs: -1

random_forest:
  n_estimators: 400
  max_features: sqrt
  min_samples_leaf: 2
  class_weight: balanced_subsample
  random_state: 42
  n_jobs: -1

comparison:
  folds: 5
  select_by: log_loss   # must be well-calibrated: these probabilities feed the HMM
  models:
    - CatBoost
    - RBF_SVM
    - LightGBM
    - ExtraTrees
    - RandomForest
  # RBF SVM doesn't scale to the full real candidates table; the comparison
  # runs on this many GPS points (all candidates kept), the selected model
  # is then refit on the full dataset for the saved/production model.
  max_points_for_comparison: 6000
